# This file defines an additional mapping for ORT's [SpdxDeclaredLicenseMapper], which augments the built-in one and
# can override entries from the build in one, see
# https://github.com/oss-review-toolkit/ort/blob/main/utils/spdx-expression/src/main/resources/declared-license-mapping.yml.
#
# Keys should only be license strings which can *not* be parsed by [SpdxExpression.parse], for example because the
# license names contain white spaces. Entries for parsable license names should be put into
# 'simple-license-mapping.yml'.
#
# Sort the entries below via IntelliJ's "Edit" -> "Sort Lines".
# Map a declared license string to "NONE" in order to discard it.
